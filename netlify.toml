[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CI = "true"
  EXPO_PUBLIC_SITE_URL = "https://mifotito.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/frames.json"]

# www and http → https://mifotito.com
[[redirects]]
  from = "https://www.mifotito.com/*"
  to = "https://mifotito.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mifotito.com/*"
  to = "https://mifotito.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mifotito.com/*"
  to = "https://mifotito.com/:splat"
  status = 301
  force = true

# Functions v2 declare their own routes with `export const config = { path }`.
# Do not rewrite /api/* to /.netlify/functions/*: a custom path is not served there,
# and a forced rewrite was returning Netlify's 404 for every API call.
# Path routing is matched before this non-forced SPA fallback, so /api is not shadowed.

# Legal pages are real files in dist, so a direct visit is 200 and readable
# without JavaScript. These rewrites keep /privacidad and /terminos at 200
# even if the host would otherwise add a trailing slash.
[[redirects]]
  from = "/privacidad"
  to = "/privacidad/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacidad/"
  to = "/privacidad"
  status = 301

[[redirects]]
  from = "/terminos"
  to = "/terminos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terminos/"
  to = "/terminos"
  status = 301

# Each public route is a real HTML file, so a crawler sees that page's title
# without JavaScript. force stops Netlify from adding a trailing slash.
# The slash form redirects to the canonical URL. The catch-all below is not
# forced, so /robots.txt and /sitemap.xml are served as files.

[[redirects]]
  from = "/crear/"
  to = "/crear"
  status = 301

[[redirects]]
  from = "/crear"
  to = "/crear/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/tarjeta/"
  to = "/tarjeta"
  status = 301

[[redirects]]
  from = "/tarjeta"
  to = "/tarjeta/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/muro/"
  to = "/muro"
  status = 301

[[redirects]]
  from = "/muro"
  to = "/muro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/regalo/"
  to = "/regalo"
  status = 301

[[redirects]]
  from = "/regalo"
  to = "/regalo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/retablo/"
  to = "/retablo"
  status = 301

[[redirects]]
  from = "/retablo"
  to = "/retablo/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/rastrear/"
  to = "/rastrear"
  status = 301

[[redirects]]
  from = "/rastrear"
  to = "/rastrear/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reclamo/"
  to = "/reclamo"
  status = 301

[[redirects]]
  from = "/reclamo"
  to = "/reclamo/index.html"
  status = 200
  force = true

# Expo single-page export: client routes fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "0"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
