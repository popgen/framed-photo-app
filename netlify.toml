[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CI = "true"
  EXPO_PUBLIC_SITE_URL = "https://mifotito.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/frames.json"]

# www and http → https://mifotito.com
[[redirects]]
  from = "https://www.mifotito.com/*"
  to = "https://mifotito.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mifotito.com/*"
  to = "https://mifotito.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://mifotito.com/*"
  to = "https://mifotito.com/:splat"
  status = 301
  force = true

# Functions v2 declare their own routes with `export const config = { path }`.
# Do not rewrite /api/* to /.netlify/functions/*: a custom path is not served there,
# and a forced rewrite was returning Netlify's 404 for every API call.
# Path routing is matched before this non-forced SPA fallback, so /api is not shadowed.

# Legal pages are real files in dist, so a direct visit is 200 and readable
# without JavaScript. These rewrites keep /privacidad and /terminos at 200
# even if the host would otherwise add a trailing slash.
[[redirects]]
  from = "/privacidad"
  to = "/privacidad/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacidad/"
  to = "/privacidad/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terminos"
  to = "/terminos/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/terminos/"
  to = "/terminos/index.html"
  status = 200
  force = true

# Public routes other than the legal pages are real files such as /crear.html.
# With Pretty URLs, /crear serves that file and /crear/ redirects to /crear.
# Redirect rules cannot add or remove a trailing slash: Netlify matches them
# either way. Do not add a /crear rule here. The catch-all below is not forced,
# so /robots.txt, /sitemap.xml, IndexNow /*.txt, and those html files are served as files.

# Expo single-page export: client routes fall back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "0"

# Netlify's zip-deploy API silently drops dot-directories, so a drag-and-drop
# deploy would lose /.well-known/. This rewrite keeps the URL working either way;
# it is a no-op for normal Git builds, where the real file is served directly.
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/assetlinks.json"
  status = 200
  force = false

# Digital Asset Links: Chrome fetches this to verify the Play Store app owns the
# domain. It must be application/json and must not be cached for long.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# IndexNow key file at /<32-hex>.txt, copied from public/ into dist.
# The SPA fallback is not forced, so this real file is served as text/plain.
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
